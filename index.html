<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263c36">
  <meta name="description" content="Srikar's little corner of the world.">
  <title>Srikar · A little corner of the world</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/valley-day.webp" fetchpriority="high">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('srikar-theme') === 'dark' ? 'dark' : 'light'; } catch {}
  </script>
  <link rel="stylesheet" href="style.css?v=quiet-map-2">
  <link rel="stylesheet" href="map.css?v=quiet-map-2">
  <script src="main.js?v=quiet-map-2" defer></script>
  <script src="map.js?v=quiet-map-2" defer></script>
</head>
<body>
  <main class="world" id="world" aria-label="An illustrated mountain valley">
    <div class="landscape">
      <img class="landscape-day" src="assets/valley-day.webp" alt="" fetchpriority="high" width="1672" height="941">
      <img class="landscape-night" src="assets/valley-night.webp" alt="" width="1672" height="941">
      <button class="owl" id="owl" hidden aria-label="Owl sounds" aria-pressed="false" title="Play gentle owl sounds">
        <img class="owl-flight" src="assets/owl-flight.webp" alt="" width="1536" height="1024">
        <img class="owl-rest" src="assets/owl-rest-v2.webp" alt="" width="1024" height="1536">
      </button>
    </div>
    <div class="shade" aria-hidden="true"></div>
    <div class="motes" aria-hidden="true"></div>
    <button class="night-toggle" id="night-toggle" aria-label="Night mode" aria-pressed="false" title="Night: an owl comes to rest">
      <svg class="to-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A9 9 0 0 1 10 4a9 9 0 1 0 10 10Z"/></svg>
      <svg class="to-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    </button>
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Hello, wanderer</h1>
      <p class="welcome">I'm Srikar.</p>
      <button class="enter-button" id="enter"><span>Learn More</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
    </section>
    <section class="explore" id="explore" aria-label="Srikar's world" hidden>
      <div class="map-viewport" id="map-viewport" tabindex="0" role="region" aria-label="World map">
        <div class="map-stage" id="map-stage">
          <img class="map-art map-art-day" src="assets/world-map-day.webp" alt="An island with cottages, gardens, an observatory and an ancient tree" width="1586" height="992" loading="lazy">
          <img class="map-art map-art-night" src="assets/world-map-night.webp" alt="" width="1586" height="992" loading="lazy">
          <nav id="landmarks" aria-label="Places"></nav>
          <button id="character-srikar" class="map-character" aria-label="Chat with Srikar’s agent" style="left:42%;top:46%"><img src="assets/traveller.webp" alt="" width="1024" height="1536"><span class="character-label">Srikar</span></button>
        </div>
      </div>
    </section>
    <dialog class="world-dialog" id="world-dialog" aria-labelledby="dialog-title"></dialog>
    <p class="sr-only" id="scene-status" role="status"></p>
  </main>
</body>
</html>
